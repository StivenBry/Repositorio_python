# Ports are bound to 127.0.0.1: only this computer can open the tool. Other
# devices on the same network (Wi-Fi, LAN) cannot reach it.
# restart: "no": the containers start only when you run `docker compose up`
# (or iniciar-openshorts.cmd), never on their own when Docker starts.
services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: "no"

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "127.0.0.1:5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: "no"
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: "no"
    depends_on:
      - backend
