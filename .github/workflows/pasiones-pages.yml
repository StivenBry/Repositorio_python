# GitHub Pages publica la carpeta /docs de main. Este workflow recompila
# "Pasiones en Pantalla" en docs/pasiones, copia terapias.html a docs/ y
# "Clips Sin Límites" (versión web) a docs/clips cada vez que cambia alguno.
name: Publicar sitio (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'pasiones-en-pantalla/**'
      - 'terapias.html'
      - 'clips-web/**'
      - '.github/workflows/pasiones-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pasiones-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pasiones-en-pantalla/package-lock.json

      - name: Compilar Pasiones en Pantalla
        working-directory: pasiones-en-pantalla
        run: |
          npm ci
          npm run build:pages

      - name: Copiar terapias.html
        run: cp terapias.html docs/terapias.html

      - name: Copiar Clips Sin Límites (versión web)
        run: |
          mkdir -p docs/clips
          cp clips-web/index.html docs/clips/index.html

      - name: Guardar el sitio en /docs
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "El sitio publicado ya está al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Actualizar sitio publicado en /docs"
          git push
